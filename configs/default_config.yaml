inference_engine: "llama_cpp"

system:
  wsl_distro: "Ubuntu"
  project_dir: "C:/Projects/VLoid"

llama_cpp:
  model_path: "./models/llm/Qwen3.5-9B-Q4_K_M.gguf"
  host: "127.0.0.1"
  port: 8080
  n_gpu_layers: -1
  ctx_size: 32768
  n_threads: 8
  mmproj_path: "./models/llm/Qwen3.5-9B-mmproj-BF16.gguf"

vllm:
  model: "cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit"
  host: "0.0.0.0"
  port: 8080
  tensor_parallel_size: 1
  max_model_len: 32768
  gpu_memory_utilization: 0.9

open-webui:
  enabled: false

tts:
  # Which model to load: "voice_design" (custom voice via text description)
  # or "voice_clone" (clone a voice from reference audio).
  # Only one model is loaded at a time.
  model: "voice_design"

  # Local paths to downloaded Qwen3-TTS model directories.
  # Set to a HuggingFace repo ID (e.g. "Qwen/Qwen3-TTS-12Hz-1.7B-Base") to
  # download on first run instead of using a local copy.
  base_model_path: "./models/tts/Qwen3-TTS-12Hz-1.7B-Base"
  vd_model_path:  "./models/tts/Qwen3-TTS-12Hz-1.7B-VoiceDesign"

  # Inference device: "cuda" | "cpu"
  device: "cuda"
  # Tensor dtype: "bfloat16" (recommended on CUDA) | "float16" | "float32"
  dtype: "bfloat16"