inference_engine: "llama_cpp"

system:
  wsl_distro: "Ubuntu"
  project_dir: "C:/Projects/VLoid"

llama_cpp:
  model_path: "./models/llm/Qwen3.5-9B-Q4_K_M.gguf"
  host: "127.0.0.1"
  port: 8080
  n_gpu_layers: -1
  ctx_size: 32768
  n_threads: 8
  mmproj_path: "./models/llm/Qwen3.5-9B-mmproj-BF16.gguf"

vllm:
  model: "cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit"
  host: "0.0.0.0"
  port: 8080
  tensor_parallel_size: 1
  max_model_len: 32768
  gpu_memory_utilization: 0.9

open-webui:
  enabled: false

tts:
  # Which model to load: "voice_design" (custom voice via text description)
  # or "voice_clone" (clone a voice from reference audio).
  # Only one model is loaded at a time.
  model: "voice_clone"

  # Local paths to downloaded Qwen3-TTS model directories.
  # Set to a HuggingFace repo ID (e.g. "Qwen/Qwen3-TTS-12Hz-1.7B-Base") to
  # download on first run instead of using a local copy.
  base_model_path: "./models/tts/Qwen3-TTS-12Hz-1.7B-Base"
  vd_model_path:  "./models/tts/Qwen3-TTS-12Hz-1.7B-VoiceDesign"

  # Inference device: "cuda" | "cpu"
  device: "cuda"
  # Tensor dtype: "bfloat16" (recommended on CUDA) | "float16" | "float32"
  dtype: "bfloat16"

  # voice_clone streaming frame parameters.
  # emit_every_frames: how many codec frames to decode before yielding a chunk.
  # decode_window_frames: lookahead window used by the streaming decoder.
  # overlap_samples: cross-fade overlap between consecutive chunks (0 = none).
  emit_every_frames: 12
  decode_window_frames: 80
  overlap_samples: 0

asr:
  # Local path to the FunASR Nano model directory (must contain model.pt + config.yaml).
  model_path: "./models/asr/Fun-ASR-Nano-2512"
  # VAD model: local path or ModelScope model ID (downloaded on first run).
  vad_model_path: "fsmn-vad"
  # Inference device: "cuda" | "cpu"
  device: "cuda"
  # VAD streaming chunk size in milliseconds (200 ms recommended).
  vad_chunk_size_ms: 200
  # Maximum single speech segment length before force-processing (ms).
  max_segment_ms: 30000
  # Set to true to load paraformer-zh-streaming for live partial results during speech.
  # Requires the streaming model to be downloaded (or will be fetched from ModelScope).
  use_streaming: false
  streaming_model_path: "paraformer-zh-streaming"
  # chunk_size: [left_context, current_chunk, right_context] in 60 ms units.
  # [0, 10, 5] → 600 ms display window, 300 ms lookahead.
  streaming_chunk_size: [0, 10, 5]
  streaming_encoder_lookback: 4
  streaming_decoder_lookback: 1