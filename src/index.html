<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Local AI Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar-left">
      <button id="new-chat-btn">+ New Chat</button>
      <div class="session-list" id="session-list">
        <div class="session-item active">Default Session</div>
      </div>
      <div class="memory-zone">
        <h3>Memory Bank</h3>
        <textarea placeholder="全局角色设定或长期记忆..."></textarea>
      </div>
    </aside>

    <main class="chat-area">
      <div class="message-container" id="message-container">
        <div class="message system">Hello! I am your local AI. How can I help you?</div>
      </div>
      <div class="input-area">
        <textarea id="user-input" placeholder="Type a message... (Shift+Enter to new line, Enter to send)"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </main>

    <aside class="sidebar-right">
      <h3>Settings & Parameters</h3>
      <div class="param-group">
        <label>System Prompt:</label>
        <textarea id="sys-prompt" rows="4">You are a helpful, smart, kind, and efficient AI assistant.</textarea>
      </div>
      <div class="param-group">
        <label>Temperature: <span id="temp-val">0.7</span></label>
        <input type="range" id="temp-slider" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="param-group">
        <label>Max Tokens: <span id="tokens-val">2048</span></label>
        <input type="range" id="tokens-slider" min="256" max="8192" step="256" value="2048">
      </div>
      <div class="param-group switch-group">
        <label>Enable RAG</label>
        <input type="checkbox" id="rag-toggle">
      </div>
    </aside>
  </div>
  <script src="renderer.js"></script>
</body>

</html>
