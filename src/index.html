<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Local AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar-left">
      <button id="open-memory-btn"
        style="background: #4a4a4a; margin-top: 5px; padding: 12px; border-radius: 8px; color: white; border: none; cursor: pointer;">📖
        Memory & Personas</button>
      <button id="new-chat-btn">✨ New Chat</button>
      <div class="session-list" id="session-list">
      </div>
    </aside>

    <main class="chat-area">
      <div class="message-container" id="message-container">
      </div>
      <div class="input-area">
        <textarea id="user-input" placeholder="Type a message... (Shift+Enter to new line, Enter to send)"></textarea>
        <div class="action-buttons">
          <button id="send-btn">Send</button>
          <button id="stop-btn" class="hidden">Stop ⏹</button>
        </div>
      </div>
    </main>

    <aside class="sidebar-right">
      <h3>Settings & Parameters</h3>
      <div class="param-group">
        <label>System Prompt:</label>
        <textarea id="sys-prompt" rows="4">You are a helpful, smart, kind, and efficient AI assistant.</textarea>
      </div>

      <div class="divider"></div>

      <div class="param-group">
        <label>Temperature: <span id="temp-val">0.7</span></label>
        <input type="range" id="temp-slider" min="0" max="2" step="0.1" value="0.7">
      </div>
      <div class="param-group">
        <label>Top-P: <span id="topp-val">0.9</span></label>
        <input type="range" id="topp-slider" min="0.1" max="1.0" step="0.05" value="0.9">
      </div>
      <div class="param-group">
        <label>Repetition Penalty: <span id="rep-val">1.1</span></label>
        <input type="range" id="rep-slider" min="0" max="2" step="0.1" value="1.1">
      </div>
      <div class="param-group">
        <label>Max Tokens: <span id="tokens-val">2048</span></label>
        <input type="range" id="tokens-slider" min="256" max="8192" step="256" value="2048">
      </div>

      <div class="divider"></div>

      <div class="param-group switch-group">
        <label>Enable RAG 📚</label>
        <label class="switch">
          <input type="checkbox" id="rag-toggle">
          <span class="slider round"></span>
        </label>
      </div>
    </aside>
  </div>

  <div id="memory-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📖 Memory Bank & Personas</h2>
        <button id="close-memory-btn" class="icon-btn">❌</button>
      </div>
      <div class="modal-body">
        <div class="import-section">
          <label for="char-file" class="upload-btn">📂 Import SillyTavern Card (PNG/WEBP/JSON)</label>
          <input type="file" id="char-file" accept="image/png, image/webp, image/jpeg, application/json" class="hidden">
        </div>

        <div class="char-preview hidden" id="char-preview">
          <img id="char-avatar" src="" alt="Avatar">
          <div class="char-info">
            <h3 id="char-name">Name</h3>
            <textarea id="char-desc" rows="6" readonly placeholder="Character description..."></textarea>
          </div>
        </div>

        <div class="action-section">
          <button id="apply-char-btn" class="hidden"
            style="width: 100%; padding: 12px; background: #007acc; color: white; border: none; border-radius: 8px; cursor: pointer;">Apply
            to System Prompt & Start Chat 🚀</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>

</html>
